apiVersion: 1
datasources:
  - name: RallyX Reporting
    uid: rallyx-reporting
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: rallyx_grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 300
      timeInterval: 1s
    secureJsonData:
      password: $GRAFANA_READER_PASSWORD
